version: 2

updates:
  # Keep npm dependencies fresh.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    groups:
      # Bundle dev tooling so we don't get one PR per @types/* bump.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Production runtime deps stay grouped by minor/patch only.
      runtime-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Avoid premature majors that would force a manual code migration.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - npm

  # Keep GitHub Actions pinned-by-tag references current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
      include: scope
    labels:
      - dependencies
      - github-actions
